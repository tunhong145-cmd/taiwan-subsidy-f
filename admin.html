  <header><h1>F 專案補助交單系統 <span class="header-sub">客戶申請管理</span></h1><div id="user-bar" class="hidden"><span id="user-email"></span><button class="secondary" id="logout-btn">登出</button></div></header>
  <main><section id="login-panel" class="panel login-box"><h2>管理員登入</h2><p class="notice">請輸入管理員帳號與密碼。</p><label for="admin-username">帳號</label><input id="admin-username" type="text" value="admin" autocomplete="username"><div style="height:12px"></div><label for="admin-password">密碼</label><input id="admin-password" type="password" autocomplete="current-password"><div style="height:12px"></div><button id="login-btn">登入</button><p id="login-msg" class="notice"></p></section>
    <section id="app-panel" class="hidden"><div class="stats"><div class="stat" style="--accent:#5865f2"><b id="stat-filtered">0</b><span>篩選結果</span></div><div class="stat" style="--accent:#3185ff"><b id="stat-today">0</b><span>當日新增</span></div><div class="stat" style="--accent:#dd8700"><b id="stat-new">0</b><span>新客戶</span></div><div class="stat" style="--accent:#8a55ed"><b id="stat-contacted">0</b><span>已聯繫</span></div><div class="stat" style="--accent:#2672a8"><b id="stat-processing">0</b><span>處理中</span></div><div class="stat" style="--accent:#6741c7"><b id="stat-approved">0</b><span>已完成</span></div><div class="stat" style="--accent:#dc3030"><b id="stat-invalid">0</b><span>無效</span></div></div>
      <div class="panel filters"><div class="filter-row"><div class="quick-dates"><button data-days="0">當日</button><button data-days="1">昨日</button><button data-days="3">近3日</button><button data-days="7">近7日</button><button data-days="30">近30日</button></div><div class="date-field"><input id="date-from" type="date" aria-label="開始日期"></div><span class="notice">至</span><div class="date-field"><input id="date-to" type="date" aria-label="結束日期"></div><div class="status-field"><select id="status-filter"><option value="">全部狀態</option><option value="new">新客戶</option><option value="contacted">已聯繫</option><option value="processing">處理中</option><option value="approved">已完成</option><option value="rejected">未通過</option><option value="invalid">無效</option></select></div><button id="refresh-btn">刷新訂單</button><div class="filter-spacer"></div><div class="search-wrap"><input id="search" placeholder="搜尋姓名 / 手機 / LINE / 身分證 / 銀行"><button id="clear-btn" class="secondary">清除</button></div></div></div>
      <div class="panel list-panel"><div class="list-head"><h2>補助申請列表</h2><div class="list-head-right"><label class="select-all-wrap"><input id="select-all" type="checkbox">全選本頁</label><span id="load-state">載入中</span><button id="export-btn" class="secondary">匯出 CSV</button></div></div><div id="lead-list" class="lead-list"></div><div class="pagination"><button id="prev-page" class="secondary">上一頁</button><span id="page-info">第 1 / 1 頁</span><button id="next-page" class="secondary">下一頁</button></div></div>
    </section></main>
  <div id="drawer-backdrop" class="drawer-backdrop hidden"></div><aside id="detail-drawer" class="detail-drawer hidden" aria-label="客戶詳細資料"><div class="drawer-head"><h2>客戶詳細資料</h2><button id="close-drawer" class="secondary">關閉</button></div><div class="drawer-body"><div id="detail-grid" class="detail-grid"></div><div class="detail-section"><h3>案件狀態</h3><select id="detail-status"><option value="new">新客戶</option><option value="contacted">已聯繫</option><option value="processing">處理中</option><option value="approved">已完成</option><option value="rejected">未通過</option><option value="invalid">無效</option></select></div><div class="detail-section"><h3>內部備註</h3><textarea id="detail-notes" placeholder="輸入備註"></textarea></div><div class="detail-section drawer-actions"><button id="copy-all" class="secondary">一鍵複製全部</button><button id="save-detail">儲存狀態與備註</button></div></div></aside><div id="toast" class="toast hidden"></div>
  <script>
    const SUPABASE_URL='https://xgjnmhedqwehxgwnlggo.supabase.co',KEY='sb_publishable_p_Y0qsHy4W4cv5f--pprEg_5Bdq1-kt',ADMIN='admin@taiwan-subsidy.com',PAGE_SIZE=20;
    const statusLabels={new:'新客戶',contacted:'已聯繫',processing:'處理中',approved:'已完成',rejected:'未通過',invalid:'無效'};let token=sessionStorage.getItem('f_admin_token')||'',leads=[],filtered=[],active=null,page=1,toastTimer;
    const el=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));const fmt=v=>v?new Intl.DateTimeFormat('zh-TW',{dateStyle:'short',timeStyle:'short',hour12:false}).format(new Date(v)):'未填寫',text=v=>v===null||v===undefined||v===''?'未填寫':String(v);
    function toast(message,bad=false){clearTimeout(toastTimer);el('toast').textContent=message;el('toast').className='toast'+(bad?' bad':'');toastTimer=setTimeout(()=>el('toast').classList.add('hidden'),2600)}async function api(path,options={}){const response=await fetch(SUPABASE_URL+path,{...options,headers:{apikey:KEY,Authorization:'Bearer '+(token||KEY),'Content-Type':'application/json',...(options.headers||{})}});if(!response.ok)throw new Error(await response.text());return response.status===204?null:response.json()}
    function setView(ok){el('login-panel').classList.toggle('hidden',ok);el('app-panel').classList.toggle('hidden',!ok);el('user-bar').classList.toggle('hidden',!ok);el('user-email').textContent=ok?ADMIN:'';if(ok)loadLeads()}async function login(){el('login-btn').disabled=true;el('login-msg').textContent='';const username=el('admin-username').value.trim(),email=username.toLowerCase()==='admin'?ADMIN:username.toLowerCase();try{if(email!==ADMIN)throw new Error('not admin');const data=await api('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email,password:el('admin-password').value})});if(data.user?.email?.toLowerCase()!==ADMIN)throw new Error('not admin');token=data.access_token;sessionStorage.setItem('f_admin_token',token);setView(true)}catch(error){console.error(error);el('login-msg').textContent='帳號或密碼錯誤。'}finally{el('login-btn').disabled=false}}async function logout(){try{if(token)await api('/auth/v1/logout',{method:'POST'})}catch{}token='';sessionStorage.removeItem('f_admin_token');setView(false)}
    async function loadLeads(){el('refresh-btn').disabled=true;el('load-state').textContent='正在更新';try{leads=await api('/rest/v1/f_subsidy_leads?select=*&order=created_at.desc')||[];applyFilters();el('load-state').textContent='最後刷新 '+new Date().toLocaleTimeString('zh-TW',{hour12:false})}catch(error){console.error(error);el('load-state').textContent='載入失敗';toast('讀取訂單失敗，請重新登入',true)}finally{el('refresh-btn').disabled=false}}
    function localDate(d){const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${day}`}function setQuickDate(days,button){document.querySelectorAll('[data-days]').forEach(x=>x.classList.toggle('active',x===button));const now=new Date(),from=new Date(now);if(days===1){from.setDate(now.getDate()-1);el('date-from').value=el('date-to').value=localDate(from)}else{from.setDate(now.getDate()-(days?days-1:0));el('date-from').value=localDate(from);el('date-to').value=localDate(now)}page=1;applyFilters()}
    function applyFilters(){const q=el('search').value.trim().toLowerCase(),status=el('status-filter').value,from=el('date-from').value?new Date(el('date-from').value+'T00:00:00'):null,to=el('date-to').value?new Date(el('date-to').value+'T23:59:59'):null;filtered=leads.filter(x=>{const hay=[x.name,x.phone,x.line_id,x.id_number,x.payout_bank,x.apply_type,x.apply_amount,x.residence,x.age].join(' ').toLowerCase(),date=new Date(x.created_at);return(!q||hay.includes(q))&&(!status||x.status===status)&&(!from||date>=from)&&(!to||date<=to)});const pages=Math.max(1,Math.ceil(filtered.length/PAGE_SIZE));if(page>pages)page=pages;render()}
    function render(){const today=localDate(new Date());el('stat-filtered').textContent=filtered.length;el('stat-today').textContent=leads.filter(x=>localDate(new Date(x.created_at))===today).length;['new','contacted','processing','approved','invalid'].forEach(s=>el('stat-'+s).textContent=filtered.filter(x=>x.status===s).length);const start=(page-1)*PAGE_SIZE,current=filtered.slice(start,start+PAGE_SIZE);el('lead-list').innerHTML=current.length?current.map((x,i)=>`<article class="lead-row"><input class="lead-check" type="checkbox" data-select="${esc(x.id)}"><div class="lead-summary"><div class="lead-title-line"><span class="lead-index">${start+i+1}</span><span class="lead-name">${esc(text(x.name))}</span><span class="tag tag-${esc(x.status)}">${esc(statusLabels[x.status]||x.status)}</span></div><div class="lead-meta"><span>手機 <strong>${esc(text(x.phone))}</strong></span><span>LINE <strong>${esc(text(x.line_id))}</strong></span><span>類型 <strong>${esc(text(x.apply_type))}</strong></span><span>金額 <strong>${esc(text(x.apply_amount))}</strong></span></div><div class="lead-time">${esc(fmt(x.created_at))}</div></div><div class="lead-actions">${Object.entries(statusLabels).map(([v,l])=>`<button class="status-btn ${x.status===v?'active':''}" data-status-id="${esc(x.id)}" data-status-value="${v}">${l}</button>`).join('')}<button class="secondary" data-open="${esc(x.id)}">詳情</button><button class="secondary" data-copy="${esc(x.id)}">複製</button></div></article>`).join(''):'<div class="empty notice">沒有符合條件的訂單</div>';const pages=Math.max(1,Math.ceil(filtered.length/PAGE_SIZE));el('page-info').textContent=`第 ${page} / ${pages} 頁，共 ${filtered.length} 筆`;el('prev-page').disabled=page<=1;el('next-page').disabled=page>=pages;el('select-all').checked=false}
    const warningText=v=>v==='yes'?'是':v==='no'?'否':'未填寫',detailFields=x=>[['申請編號','F-'+x.id.slice(0,8).toUpperCase()],['提交時間',fmt(x.created_at)],['姓名',text(x.name)],['年齡',text(x.age)],['居住地',text(x.residence)],['手機',text(x.phone)],['LINE ID',text(x.line_id)],['身分證字號',text(x.id_number)],['補助類型',text(x.apply_type)],['申請金額',text(x.apply_amount)],['打款銀行',text(x.payout_bank)],['警示戶',warningText(x.warning_account)],['來源網址',text(x.source_url)]];function copyBlock(x,notes=x.notes||''){return detailFields(x).map(([l,v])=>`${l}：${v}`).join('\n')+`\n案件狀態：${statusLabels[x.status]||x.status}\n備註：${notes}`}
    function openDetail(id){active=leads.find(x=>x.id===id);if(!active)return;el('detail-grid').innerHTML=detailFields(active).map(([l,v])=>`<div class="detail-item"><button class="copy-link" data-copy-value="${esc(v)}">複製</button><label>${esc(l)}</label><div class="detail-value">${esc(v)}</div></div>`).join('');el('detail-status').value=active.status;el('detail-notes').value=active.notes||'';el('detail-drawer').classList.remove('hidden');el('drawer-backdrop').classList.remove('hidden')}function closeDetail(){el('detail-drawer').classList.add('hidden');el('drawer-backdrop').classList.add('hidden');active=null}async function copyText(value){try{await navigator.clipboard.writeText(value);toast('已複製')}catch{toast('複製失敗，請允許剪貼簿權限',true)}}async function updateLead(id,patch){try{await api('/rest/v1/f_subsidy_leads?id=eq.'+encodeURIComponent(id),{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify(patch)});toast('已儲存');await loadLeads();return true}catch(error){console.error(error);toast('更新失敗',true);return false}}
    function csvCell(v){return '"'+String(v??'').replace(/"/g,'""')+'"'}function exportCsv(){const selected=[...document.querySelectorAll('.lead-check:checked')].map(x=>x.dataset.select),data=selected.length?leads.filter(x=>selected.includes(x.id)):filtered;if(!data.length)return toast('目前沒有可匯出的資料',true);const cols=[['created_at','提交時間'],['name','姓名'],['age','年齡'],['residence','居住地'],['phone','手機'],['line_id','LINE ID'],['id_number','身分證字號'],['apply_type','補助類型'],['apply_amount','申請金額'],['payout_bank','打款銀行'],['warning_account','警示戶'],['status','狀態'],['notes','備註']];const csv='\ufeff'+cols.map(x=>csvCell(x[1])).join(',')+'\r\n'+data.map(row=>cols.map(([key])=>csvCell(key==='warning_account'?warningText(row[key]):key==='status'?statusLabels[row[key]]:row[key])).join(',')).join('\r\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='F補助申請_'+localDate(new Date())+'.csv';a.click();URL.revokeObjectURL(a.href);toast(selected.length?'已匯出選取訂單':'已匯出篩選結果')}
    el('login-btn').addEventListener('click',login);el('admin-password').addEventListener('keydown',e=>{if(e.key==='Enter')login()});el('logout-btn').addEventListener('click',logout);el('refresh-btn').addEventListener('click',loadLeads);el('clear-btn').addEventListener('click',()=>{el('search').value=el('status-filter').value=el('date-from').value=el('date-to').value='';document.querySelectorAll('[data-days]').forEach(x=>x.classList.remove('active'));page=1;applyFilters()});document.querySelectorAll('[data-days]').forEach(button=>button.addEventListener('click',()=>setQuickDate(Number(button.dataset.days),button)));['search','status-filter','date-from','date-to'].forEach(id=>el(id).addEventListener(id==='search'?'input':'change',()=>{if(id==='date-from'||id==='date-to')document.querySelectorAll('[data-days]').forEach(x=>x.classList.remove('active'));page=1;applyFilters()}));
    el('lead-list').addEventListener('click',e=>{const status=e.target.closest('[data-status-id]'),open=e.target.closest('[data-open]'),copy=e.target.closest('[data-copy]');if(status)updateLead(status.dataset.statusId,{status:status.dataset.statusValue});if(open)openDetail(open.dataset.open);if(copy){const x=leads.find(y=>y.id===copy.dataset.copy);if(x)copyText(copyBlock(x))}});el('detail-grid').addEventListener('click',e=>{const copy=e.target.closest('[data-copy-value]');if(copy)copyText(copy.dataset.copyValue)});el('save-detail').addEventListener('click',async()=>{if(!active)return;el('save-detail').disabled=true;const id=active.id;if(await updateLead(id,{status:el('detail-status').value,notes:el('detail-notes').value}))closeDetail();el('save-detail').disabled=false});el('copy-all').addEventListener('click',()=>{if(active)copyText(copyBlock({...active,status:el('detail-status').value},el('detail-notes').value))});el('close-drawer').addEventListener('click',closeDetail);el('drawer-backdrop').addEventListener('click',closeDetail);el('export-btn').addEventListener('click',exportCsv);el('select-all').addEventListener('change',e=>document.querySelectorAll('.lead-check').forEach(x=>x.checked=e.target.checked));el('prev-page').addEventListener('click',()=>{if(page>1){page--;render()}});el('next-page').addEventListener('click',()=>{if(page<Math.ceil(filtered.length/PAGE_SIZE)){page++;render()}});setView(Boolean(token));
  </script>
