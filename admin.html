<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>F 專案｜補助申請後台</title>
  <style>
    :root{--brand:#126e55;--brand2:#0c5542;--soft:#e9f5f0;--ink:#18251f;--muted:#697870;--line:#dce5e0;--bg:#f4f7f5;--danger:#b52c25;--warn:#a76b08;--blue:#1f6fb2}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif}button,input,select,textarea{font:inherit}.hidden{display:none!important}.btn{border:0;border-radius:9px;padding:10px 14px;font-weight:700;cursor:pointer}.primary{background:var(--brand);color:#fff}.secondary{background:#edf2ef;color:#42564c}.danger{background:#fff0ef;color:var(--danger)}.btn:disabled{opacity:.55;cursor:not-allowed}.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 15% 15%,#d8eee5,transparent 33%),var(--bg)}.login-card{width:min(410px,100%);background:#fff;border:1px solid var(--line);border-radius:18px;padding:34px;box-shadow:0 20px 60px rgba(20,62,43,.12)}.mark{width:48px;height:48px;display:grid;place-items:center;background:var(--brand);color:#fff;border-radius:13px;font-weight:900}.login h1{font-size:24px;margin:18px 0 6px}.muted{color:var(--muted)}.field{margin:18px 0}.field label{display:block;font-size:13px;font-weight:800;margin-bottom:7px}.input{width:100%;border:1px solid #ccd8d1;border-radius:9px;padding:11px 12px;outline:0}.input:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(18,110,85,.12)}.login .primary{width:100%}.msg{min-height:20px;color:var(--danger);font-size:13px;margin:12px 0 0}
    header{background:var(--brand2);color:#fff}.head{max-width:1320px;margin:auto;min-height:70px;padding:13px 22px;display:flex;align-items:center;justify-content:space-between;gap:16px}.head h1{font-size:20px;margin:0}.head small{color:#bdd9cf}.head-actions{display:flex;gap:8px}.head .btn{background:rgba(255,255,255,.12);color:#fff}main{max-width:1320px;margin:auto;padding:24px 22px 48px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-bottom:18px}.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:17px}.stat span{color:var(--muted);font-size:12px}.stat strong{display:block;font-size:27px;margin-top:5px}.toolbar,.panel{background:#fff;border:1px solid var(--line);border-radius:13px}.toolbar{padding:14px;display:flex;flex-wrap:wrap;gap:9px;margin-bottom:13px}.toolbar .input{width:auto;min-width:170px}.search{flex:1;min-width:220px!important}.panel{overflow:hidden}.panel-head{padding:15px 17px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px}.panel-head h2{font-size:16px;margin:0}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:1050px}th,td{padding:12px 14px;border-bottom:1px solid #edf1ef;text-align:left;font-size:13px;vertical-align:middle}th{background:#fafcfb;color:var(--muted);font-size:11px;white-space:nowrap}tbody tr:hover{background:#fbfdfc}.name{font-weight:800}.status{border:0;border-radius:999px;padding:6px 9px;font-weight:700;background:#edf2ef;color:#42564c}.status-new{background:#fff3d9;color:#91600b}.status-approved{background:#e5f5ed;color:#126e55}.status-rejected,.status-invalid{background:#ffebea;color:#a92a24}.row-actions{display:flex;gap:6px}.row-actions .btn{padding:7px 9px;font-size:12px}.empty{text-align:center;padding:48px;color:var(--muted)}.toast{position:fixed;right:20px;bottom:20px;background:#203129;color:#fff;border-radius:9px;padding:12px 15px;z-index:30}.toast.bad{background:var(--danger)}
    dialog{width:min(720px,calc(100% - 28px));border:0;border-radius:16px;padding:0;box-shadow:0 24px 80px rgba(0,0,0,.24)}dialog::backdrop{background:rgba(13,26,20,.55)}.modal-head{padding:17px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.modal-head h2{margin:0;font-size:19px}.close{border:0;background:none;font-size:25px;cursor:pointer}.modal-body{padding:20px}.details{display:grid;grid-template-columns:1fr 1fr;gap:11px}.detail{border:1px solid var(--line);border-radius:9px;padding:10px}.detail span{display:block;color:var(--muted);font-size:11px}.detail strong{display:block;margin-top:3px;word-break:break-word}.detail button{float:right;border:0;background:none;color:var(--blue);cursor:pointer}.notes{min-height:90px;resize:vertical}.modal-actions{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px;margin-top:16px}
    @media(max-width:700px){.head{padding:12px 14px}.head small{display:none}.head-actions .btn{padding:8px 10px}main{padding:15px 12px 35px}.stats{grid-template-columns:1fr 1fr;gap:8px}.toolbar{display:grid;grid-template-columns:1fr 1fr}.toolbar .input,.search{width:100%!important;min-width:0!important}.search{grid-column:1/-1}.panel-head{align-items:flex-start}.details{grid-template-columns:1fr}.login-card{padding:27px 21px}}
  </style>
</head>
<body>
  <section id="loginView" class="login"><form id="loginForm" class="login-card"><div class="mark">F</div><h1>管理員登入</h1><p class="muted">登入後管理 F 專案補助申請訂單。</p><div class="field"><label for="email">管理員帳號</label><input class="input" id="email" type="email" value="admin@taiwan-subsidy.com" autocomplete="username" required></div><div class="field"><label for="password">密碼</label><input class="input" id="password" type="password" autocomplete="current-password" required autofocus></div><button id="loginBtn" class="btn primary" type="submit">登入後台</button><p id="loginMsg" class="msg"></p></form></section>
  <div id="app" class="hidden"><header><div class="head"><div><h1>F 專案｜補助申請管理</h1><small>獨立訂單後台</small></div><div class="head-actions"><button id="refreshBtn" class="btn">刷新</button><button id="logoutBtn" class="btn">登出</button></div></div></header><main>
    <section class="stats"><div class="stat"><span>目前結果</span><strong id="statTotal">0</strong></div><div class="stat"><span>新訂單</span><strong id="statNew">0</strong></div><div class="stat"><span>處理中</span><strong id="statProcessing">0</strong></div><div class="stat"><span>已完成</span><strong id="statDone">0</strong></div></section>
    <section class="toolbar"><input id="search" class="input search" placeholder="搜尋姓名、手機、LINE、身分證或銀行"><select id="statusFilter" class="input"><option value="">全部狀態</option><option value="new">新訂單</option><option value="contacted">已聯繫</option><option value="processing">處理中</option><option value="approved">已完成</option><option value="rejected">未通過</option><option value="invalid">無效</option></select><input id="dateFrom" class="input" type="date" aria-label="開始日期"><input id="dateTo" class="input" type="date" aria-label="結束日期"><button id="exportBtn" class="btn secondary">匯出 CSV</button></section>
    <section class="panel"><div class="panel-head"><div><h2>訂單列表</h2><span id="loadState" class="muted">載入中…</span></div><button id="clearBtn" class="btn secondary">清除篩選</button></div><div class="table-wrap"><table><thead><tr><th>提交時間</th><th>姓名</th><th>手機</th><th>補助類型</th><th>金額</th><th>銀行</th><th>狀態</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table><div id="empty" class="empty hidden">沒有符合條件的訂單</div></div></section>
  </main></div>
  <dialog id="detailDialog"><div class="modal-head"><h2>訂單詳情</h2><button class="close" id="closeDialog" aria-label="關閉">×</button></div><div class="modal-body"><div id="detailGrid" class="details"></div><div class="field"><label for="detailStatus">狀態</label><select class="input" id="detailStatus"><option value="new">新訂單</option><option value="contacted">已聯繫</option><option value="processing">處理中</option><option value="approved">已完成</option><option value="rejected">未通過</option><option value="invalid">無效</option></select></div><div class="field"><label for="detailNotes">備註</label><textarea class="input notes" id="detailNotes" placeholder="輸入內部備註"></textarea></div><div class="modal-actions"><button id="copyAllBtn" class="btn secondary">一鍵複製全部</button><button id="saveBtn" class="btn primary">儲存狀態與備註</button></div></div></dialog><div id="toast" class="toast hidden"></div>
  <script>
    const SUPABASE_URL='https://xgjnmhedqwehxgwnlggo.supabase.co',KEY='sb_publishable_p_Y0qsHy4W4cv5f--pprEg_5Bdq1-kt',ADMIN='admin@taiwan-subsidy.com';let accessToken=sessionStorage.getItem('f_admin_token')||'',leads=[],filtered=[],active=null,toastTimer;
    const labels={new:'新訂單',contacted:'已聯繫',processing:'處理中',approved:'已完成',rejected:'未通過',invalid:'無效'};const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));const fmt=v=>v?new Intl.DateTimeFormat('zh-TW',{dateStyle:'short',timeStyle:'short',hour12:false}).format(new Date(v)):'—';
    function toast(m,bad=false){clearTimeout(toastTimer);toastEl.textContent=m;toastEl.className='toast'+(bad?' bad':'');toastTimer=setTimeout(()=>toastEl.classList.add('hidden'),2800)}const toastEl=document.getElementById('toast');
    function setView(ok){loginView.classList.toggle('hidden',ok);app.classList.toggle('hidden',!ok);if(ok)load();}
    async function api(path,options={}){const response=await fetch(SUPABASE_URL+path,{...options,headers:{apikey:KEY,Authorization:'Bearer '+(accessToken||KEY),'Content-Type':'application/json',...(options.headers||{})}});if(!response.ok)throw new Error(await response.text());return response.status===204?null:response.json()}
    async function load(){refreshBtn.disabled=true;loadState.textContent='正在更新…';try{leads=await api('/rest/v1/f_subsidy_leads?select=*&order=created_at.desc')||[];applyFilters();loadState.textContent='最後刷新：'+new Date().toLocaleTimeString('zh-TW',{hour12:false})}catch(error){console.error(error);loadState.textContent='載入失敗';toast('讀取訂單失敗，請重新登入',true)}finally{refreshBtn.disabled=false}}
    function applyFilters(){const q=search.value.trim().toLowerCase(),st=statusFilter.value,from=dateFrom.value?new Date(dateFrom.value+'T00:00:00'):null,to=dateTo.value?new Date(dateTo.value+'T23:59:59'):null;filtered=leads.filter(x=>{const text=[x.name,x.phone,x.line_id,x.id_number,x.payout_bank,x.apply_type].join(' ').toLowerCase(),d=new Date(x.created_at);return(!q||text.includes(q))&&(!st||x.status===st)&&(!from||d>=from)&&(!to||d<=to)});render();}
    function render(){statTotal.textContent=filtered.length;statNew.textContent=filtered.filter(x=>x.status==='new').length;statProcessing.textContent=filtered.filter(x=>['contacted','processing'].includes(x.status)).length;statDone.textContent=filtered.filter(x=>x.status==='approved').length;rows.innerHTML=filtered.map(x=>`<tr><td>${esc(fmt(x.created_at))}</td><td class="name">${esc(x.name)}</td><td>${esc(x.phone)}</td><td>${esc(x.apply_type)}</td><td>${esc(x.apply_amount)}</td><td>${esc(x.payout_bank)}</td><td><select class="status status-${esc(x.status)}" data-status="${esc(x.id)}">${Object.entries(labels).map(([v,l])=>`<option value="${v}" ${x.status===v?'selected':''}>${l}</option>`).join('')}</select></td><td><div class="row-actions"><button class="btn secondary" data-open="${esc(x.id)}">詳情</button><button class="btn secondary" data-copy="${esc(x.id)}">複製</button></div></td></tr>`).join('');empty.classList.toggle('hidden',filtered.length>0);document.querySelector('.table-wrap table').classList.toggle('hidden',filtered.length===0)}
    const detailFields=x=>[['申請編號','F-'+x.id.slice(0,8).toUpperCase()],['提交時間',fmt(x.created_at)],['姓名',x.name],['年齡',x.age],['居住地',x.residence],['手機',x.phone],['LINE ID',x.line_id],['身分證字號',x.id_number],['補助類型',x.apply_type],['申請金額',x.apply_amount],['打款銀行',x.payout_bank],['警示戶',x.warning_account?'是':'否'],['來源網址',x.source_url||'—']];
    function openDetail(id){active=leads.find(x=>x.id===id);if(!active)return;detailGrid.innerHTML=detailFields(active).map(([l,v])=>`<div class="detail"><button data-value="${esc(v)}">複製</button><span>${esc(l)}</span><strong>${esc(v)}</strong></div>`).join('');detailStatus.value=active.status;detailNotes.value=active.notes||'';detailDialog.showModal()}
    async function copyText(v){try{await navigator.clipboard.writeText(v);toast('已複製')}catch{toast('複製失敗，請允許剪貼簿權限',true)}}
    async function update(id,patch){try{await api('/rest/v1/f_subsidy_leads?id=eq.'+encodeURIComponent(id),{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify(patch)});toast('已儲存');await load();return true}catch(error){console.error(error);toast('更新失敗',true);return false}}
    rows.addEventListener('click',e=>{const o=e.target.closest('[data-open]'),c=e.target.closest('[data-copy]');if(o)openDetail(o.dataset.open);if(c){const x=leads.find(y=>y.id===c.dataset.copy);copyText(detailFields(x).map(([l,v])=>`${l}：${v}`).join('\n'))}});rows.addEventListener('change',e=>{if(e.target.matches('[data-status]'))update(e.target.dataset.status,{status:e.target.value})});detailGrid.addEventListener('click',e=>{const b=e.target.closest('[data-value]');if(b)copyText(b.dataset.value)});
    saveBtn.addEventListener('click',async()=>{saveBtn.disabled=true;if(await update(active.id,{status:detailStatus.value,notes:detailNotes.value.trim()}))detailDialog.close();saveBtn.disabled=false});copyAllBtn.addEventListener('click',()=>copyText(detailFields(active).map(([l,v])=>`${l}：${v}`).join('\n')+'\n備註：'+detailNotes.value));closeDialog.addEventListener('click',()=>detailDialog.close());
    function csvCell(v){return'"'+String(v??'').replace(/"/g,'""')+'"'}exportBtn.addEventListener('click',()=>{if(!filtered.length)return toast('目前沒有可匯出的資料',true);const cols=[['created_at','提交時間'],['name','姓名'],['age','年齡'],['residence','居住地'],['phone','手機'],['line_id','LINE ID'],['id_number','身分證字號'],['apply_type','補助類型'],['apply_amount','申請金額'],['payout_bank','打款銀行'],['warning_account','警示戶'],['status','狀態'],['notes','備註']];const csv='\ufeff'+cols.map(x=>csvCell(x[1])).join(',')+'\r\n'+filtered.map(r=>cols.map(([k])=>csvCell(k==='warning_account'?(r[k]?'是':'否'):k==='status'?labels[r[k]]:r[k])).join(',')).join('\r\n');const a=document.createElement('a');a.href=window.URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='F補助申請_'+new Date().toISOString().slice(0,10)+'.csv';a.click();window.URL.revokeObjectURL(a.href)});
    [search,statusFilter,dateFrom,dateTo].forEach(x=>x.addEventListener(x.tagName==='INPUT'&&x.type==='text'?'input':'change',applyFilters));clearBtn.addEventListener('click',()=>{search.value=statusFilter.value=dateFrom.value=dateTo.value='';applyFilters()});refreshBtn.addEventListener('click',load);logoutBtn.addEventListener('click',async()=>{try{if(accessToken)await api('/auth/v1/logout',{method:'POST'})}catch{}accessToken='';sessionStorage.removeItem('f_admin_token');setView(false)});
    loginForm.addEventListener('submit',async e=>{e.preventDefault();loginBtn.disabled=true;loginMsg.textContent='';const mail=email.value.trim().toLowerCase();if(mail!==ADMIN){loginMsg.textContent='此帳號沒有管理權限。';loginBtn.disabled=false;return}try{const data=await api('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email:mail,password:password.value})});if(data.user?.email?.toLowerCase()!==ADMIN)throw new Error('not admin');accessToken=data.access_token;sessionStorage.setItem('f_admin_token',accessToken);setView(true)}catch(error){console.error(error);loginMsg.textContent='帳號或密碼錯誤。'}finally{loginBtn.disabled=false}});
    setView(Boolean(accessToken));
  </script>
</body>
</html>
