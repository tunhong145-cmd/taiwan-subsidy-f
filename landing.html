<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="format-detection" content="telephone=no">
  <meta name="theme-color" content="#0d7b8a">
  <meta name="description" content="ポケマネ｜安心・簡単なキャッシング。">
  <title>ポケマネ | 安心・簡単なキャッシング</title>
  <link rel="stylesheet" href="./base.css">
  <link rel="stylesheet" href="./home.css">
  <link rel="stylesheet" href="./lead-form.css">
  <style>.not-found{min-height:100vh;display:grid;place-items:center;padding:32px;background:#f5f7f8;color:#16272b;text-align:center;font-family:Arial,"Noto Sans JP",sans-serif}.not-found strong{display:block;font-size:76px;line-height:1;color:#0d7b8a}.not-found p{margin:18px 0 0;color:#66777b;font-size:16px}</style>
</head>
<body>
  <div id="app"></div>
  <script>
    (()=>{
      const page=new URLSearchParams(location.search).get('page');
      if(!/^(main|page[1-9][0-9]*)$/.test(page||'')){
        document.title='404 | Page Not Found';
        document.body.innerHTML='<main class="not-found"><div><strong>404</strong><p>ページが見つかりません。</p></div></main>';
        return;
      }
      const publicUrl=location.pathname+location.search+location.hash;
      history.replaceState(null,'','./'+location.search+location.hash);
      const appScript=document.createElement('script');appScript.type='module';appScript.src='./assets/index-N6zoiNVw-v3.js';appScript.onload=()=>setTimeout(()=>history.replaceState(null,'',publicUrl),500);document.body.appendChild(appScript);
      const formScript=document.createElement('script');formScript.src='./lead-form.js?v=4';document.body.appendChild(formScript);
    })();
  </script>
</body>
</html>
