<!doctype html>
<html lang="zh-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>F 專案投手後台</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef2f6;color:#17233a;font-family:"Microsoft JhengHei",sans-serif}header{min-height:66px;padding:14px 26px;background:#121d31;color:#fff;display:flex;align-items:center;justify-content:space-between}header h1{font-size:19px;margin:0}button{border:1px solid transparent;border-radius:7px;padding:8px 12px;background:#146abd;color:#fff;font:inherit;font-size:13px;font-weight:800;cursor:pointer}button.secondary{background:#fff;color:#56657a;border-color:#d5dee8}button:disabled{opacity:.5}.hidden{display:none!important}main{max-width:1320px;margin:auto;padding:26px 18px}.panel{background:#fff;border:1px solid #dbe3ec;border-radius:9px;margin-bottom:18px;box-shadow:0 2px 8px rgba(20,40,70,.04)}.login{max-width:420px;margin:50px auto;padding:22px}.notice{color:#718096;font-size:13px}.error{color:#b42318}label{display:block;font-size:13px;font-weight:800;margin-bottom:6px}input,select,textarea{width:100%;border:1px solid #d1dbe6;border-radius:7px;padding:9px;font:inherit}.stats{display:grid;grid-template-columns:repeat(7,1fr);gap:10px;margin-bottom:18px}.stat{background:#fff;border:1px solid #dbe3ec;border-left:5px solid #3478d1;border-radius:8px;padding:16px}.stat b{display:block;font-size:28px}.stat span{font-size:12px;color:#718096}.filters{padding:16px}.row{display:flex;align-items:end;gap:10px;flex-wrap:wrap}.quick{display:flex}.quick button{border-radius:0;background:#fff;color:#617087;border-color:#d6dfe9}.quick button:first-child{border-radius:7px 0 0 7px}.quick button:last-child{border-radius:0 7px 7px 0}.field{width:150px}.search{min-width:280px;flex:1}.list-head{padding:14px 18px;border-bottom:1px solid #e0e6ed;display:flex;justify-content:space-between;align-items:center;gap:10px}.leads{min-height:120px}.lead{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:12px;padding:13px 18px;border-bottom:1px solid #e5eaf0;align-items:center}.title{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.index{color:#96a2b5}.name{font-weight:900}.tag{border-radius:4px;padding:3px 7px;background:#e7f1ff;color:#2367ae;font-size:11px}.meta{display:flex;gap:8px 18px;flex-wrap:wrap;color:#596980;font-size:13px;margin-top:6px}.time{color:#98a4b6;font-size:12px;margin-top:6px}.actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.status{background:#fff;color:#617087;border-color:#d6dfe9}.status.active{background:#e6f2ff;color:#1264ad;border-color:#9fc7eb}.pager{padding:13px;display:flex;justify-content:center;gap:9px;border-top:1px solid #e0e6ed}.empty{text-align:center;padding:32px}.backdrop{position:fixed;inset:0;background:#17233a55;z-index:10}.drawer{position:fixed;right:0;top:0;bottom:0;width:min(540px,100%);background:#fff;z-index:11;overflow:auto;box-shadow:-8px 0 25px #17233a30}.drawer-head{position:sticky;top:0;background:#fff;padding:17px 20px;border-bottom:1px solid #e0e6ed;display:flex;justify-content:space-between}.drawer-body{padding:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.item{border:1px solid #e0e6ed;border-radius:7px;padding:9px}.item label{font-size:11px;color:#8390a3}.section{border-top:1px solid #e0e6ed;margin-top:16px;padding-top:16px}.copybox{min-height:270px;background:#f7f9fb;line-height:1.6}.toast{position:fixed;right:18px;bottom:18px;background:#173629;color:#fff;padding:11px 14px;border-radius:7px;z-index:20}@media(max-width:900px){.stats{grid-template-columns:repeat(3,1fr)}.lead{grid-template-columns:24px 1fr}.lead .actions{grid-column:2;justify-content:flex-start}}@media(max-width:650px){header{padding:13px}main{padding:12px 8px}.stats{grid-template-columns:repeat(2,1fr)}.quick{width:100%;overflow:auto}.field,.search{width:100%;min-width:0}.lead{display:block}.lead>input{margin-bottom:8px}.actions{justify-content:flex-start;margin-top:10px}.grid{grid-template-columns:1fr}.list-head{align-items:flex-start;flex-direction:column}}
</style></head><body>
<header><h1 id="title">投手交單系統</h1><button id="logout" class="secondary hidden">登出</button></header><main>
<section id="login" class="panel login"><h2>投手後台登入</h2><p id="page-label" class="notice"></p><label>密碼</label><input id="password" type="password" autocomplete="current-password"><div style="height:13px"></div><button id="login-btn">登入</button><p id="msg" class="notice"></p></section>
<section id="app" class="hidden"><div class="stats"><div class="stat"><b id="s-filtered">0</b><span>篩選結果</span></div><div class="stat"><b id="s-today">0</b><span>當日新增</span></div><div class="stat"><b id="s-new">0</b><span>新客戶</span></div><div class="stat"><b id="s-contacted">0</b><span>已聯繫</span></div><div class="stat"><b id="s-processing">0</b><span>處理中</span></div><div class="stat"><b id="s-approved">0</b><span>已完成</span></div><div class="stat"><b id="s-invalid">0</b><span>無效</span></div></div>
<div class="panel filters"><div class="row"><div class="quick"><button data-days="0">當日</button><button data-days="1">昨日</button><button data-days="3">近3日</button><button data-days="7">近7日</button><button data-days="30">近30日</button></div><div class="field"><input id="from" type="date" aria-label="開始日期"></div><div class="field"><input id="to" type="date" aria-label="結束日期"></div><div class="field"><select id="status"><option value="">全部狀態</option><option value="new">新客戶</option><option value="contacted">已聯繫</option><option value="processing">處理中</option><option value="approved">已完成</option><option value="rejected">未通過</option><option value="invalid">無效</option></select></div><div class="search"><input id="search" placeholder="搜尋姓名 / 手機 / LINE / 身分證 / 銀行"></div><button id="refresh">刷新訂單</button><button id="clear" class="secondary">清除</button></div></div>
<div class="panel"><div class="list-head"><div><strong>補助申請列表</strong> <span id="count" class="notice"></span></div><div class="actions"><label style="margin:0"><input id="select-all" type="checkbox" style="width:auto"> 全選本頁</label><button id="export" class="secondary">匯出 CSV</button></div></div><div id="leads" class="leads"></div><div class="pager"><button id="prev" class="secondary">上一頁</button><span id="page-info" class="notice"></span><button id="next" class="secondary">下一頁</button></div></div></section></main>
<div id="backdrop" class="backdrop hidden"></div><aside id="drawer" class="drawer hidden"><div class="drawer-head"><strong id="detail-title">詳細資料</strong><button id="close" class="secondary">關閉</button></div><div id="detail-body" class="drawer-body"></div></aside><div id="toast" class="toast hidden"></div>
<script>
const URL_='https://xgjnmhedqwehxgwnlggo.supabase.co',KEY='sb_publishable_p_Y0qsHy4W4cv5f--pprEg_5Bdq1-kt',slug=new URLSearchParams(location.search).get('page')||'main',PAGE_SIZE=100,statusLabels={new:'新客戶',contacted:'已聯繫',processing:'處理中',approved:'已完成',rejected:'未通過',invalid:'無效'};
let pagePassword='',rows=[],total=0,page=1,pages=1,stats={},selected=new Map(),active=null,searchTimer=null,toastTimer=null;const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c])),text=v=>String(v??'').trim()||'未填寫';
$('page-label').textContent='登入 Page：'+slug;$('title').textContent=slug+' 投手交單系統';
async function rpc(name,body){const r=await fetch(URL_+'/rest/v1/rpc/'+name,{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify(body)});if(!r.ok)throw new Error(await r.text());return r.status===204?null:r.json()}
function localValue(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function dayStart(v){return v?new Date(v+'T00:00:00').toISOString():null}function dayEnd(v){if(!v)return null;const d=new Date(v+'T00:00:00');d.setDate(d.getDate()+1);return d.toISOString()}function todayRange(){const a=new Date();a.setHours(0,0,0,0);const b=new Date(a);b.setDate(b.getDate()+1);return{from:a.toISOString(),to:b.toISOString()}}
function params(){const t=todayRange();return{target_slug:slug,page_password:pagePassword,p_page:page,p_page_size:PAGE_SIZE,p_search:$('search').value.trim()||null,p_status:$('status').value||null,p_from:dayStart($('from').value),p_to:dayEnd($('to').value),p_today_from:t.from,p_today_to:t.to}}
async function login(){const b=$('login-btn');b.disabled=true;pagePassword=$('password').value;try{if(!await rpc('f_page_login',{target_slug:slug,page_password:pagePassword}))throw 0;$('login').classList.add('hidden');$('app').classList.remove('hidden');$('logout').classList.remove('hidden');setQuick(0);await load()}catch{$('msg').textContent='Page 不存在、已停用或密碼錯誤';$('msg').className='notice error'}finally{b.disabled=false}}
async function load(reset=false){if(reset)page=1;const b=$('refresh');b.disabled=true;try{const data=await rpc('get_f_page_leads_page',params());rows=data?.rows||[];total=Number(data?.total||0);stats=data?.stats||{};pages=Math.max(1,Math.ceil(total/PAGE_SIZE));if(page>pages){page=pages;return load()}rows.forEach(r=>{if(selected.has(r.id))selected.set(r.id,r)});render()}catch(e){alert('讀取訂單失敗，請重新登入');location.reload()}finally{b.disabled=false}}
function fmt(v){return v?new Date(v).toLocaleString('zh-TW',{hour12:false}):''}function warning(v){return v==='yes'?'是':v==='no'?'否':text(v)}
function copyBlock(r,notes=r.notes||''){return [['申請編號','F-'+r.id.slice(0,8).toUpperCase()],['姓名',text(r.name)],['年齡',text(r.age)],['居住地',text(r.residence)],['手機',text(r.phone)],['LINE ID',text(r.line_id)],['身分證字號',text(r.id_number)],['補助類型',text(r.apply_type)],['申請金額',text(r.apply_amount)],['打款銀行',text(r.payout_bank)],['警示戶',warning(r.warning_account)]].map(x=>x[0]+'：'+x[1]).join('\n')+'\n\n備註：'+notes}
function render(){['filtered','today','new','contacted','processing','approved','invalid'].forEach(k=>$('s-'+k).textContent=Number(stats[k]||0));$('count').textContent=`共 ${total} 筆`;const start=(page-1)*PAGE_SIZE;$('leads').innerHTML=rows.length?rows.map((r,i)=>`<article class="lead"><input type="checkbox" data-select="${r.id}" ${selected.has(r.id)?'checked':''}><div><div class="title"><span class="index">${Math.max(total-start-i,1)}</span><span class="name">${esc(text(r.name))}</span><span class="tag">${esc(text(r.apply_type))}</span><span class="tag">${esc(statusLabels[r.status]||r.status)}</span></div><div class="meta"><span>手機 <b>${esc(text(r.phone))}</b></span><span>LINE <b>${esc(text(r.line_id))}</b></span><span>金額 <b>${esc(text(r.apply_amount))}</b></span><span>居住 <b>${esc(text(r.residence))}</b></span></div><div class="time">${esc(fmt(r.created_at))}</div></div><div class="actions">${Object.entries(statusLabels).map(([v,l])=>`<button class="status ${r.status===v?'active':''}" data-status="${v}" data-id="${r.id}">${l}</button>`).join('')}<button class="secondary" data-copy="${r.id}">複製</button><button class="secondary" data-open="${r.id}">詳情</button></div></article>`).join(''):'<div class="empty notice">沒有符合條件的訂單</div>';$('page-info').textContent=`第 ${page} / ${pages} 頁`;$('prev').disabled=page<=1;$('next').disabled=page>=pages;const visible=rows.filter(r=>selected.has(r.id)).length;$('select-all').checked=rows.length>0&&visible===rows.length;$('select-all').indeterminate=visible>0&&visible<rows.length;$('export').textContent=selected.size?`匯出已選 ${selected.size} 筆`:'匯出 CSV'}
async function update(id,status=null,notes=null){try{await rpc('update_f_page_lead',{target_slug:slug,page_password:pagePassword,lead_id:id,new_status:status,new_notes:notes});showToast('已儲存');await load()}catch(e){alert('更新失敗')}}
function detail(id){active=rows.find(r=>r.id===id);if(!active)return;$('detail-title').textContent=text(active.name)+'｜詳細資料';const fields=[['提交時間',fmt(active.created_at)],['姓名',text(active.name)],['年齡',text(active.age)],['居住地',text(active.residence)],['手機',text(active.phone)],['LINE ID',text(active.line_id)],['身分證字號',text(active.id_number)],['補助類型',text(active.apply_type)],['申請金額',text(active.apply_amount)],['打款銀行',text(active.payout_bank)],['警示戶',warning(active.warning_account)]];$('detail-body').innerHTML=`<div class="grid">${fields.map(x=>`<div class="item"><label>${x[0]}</label><div>${esc(x[1])}</div></div>`).join('')}</div><div class="section"><h3>提供甲方的客戶資料</h3><textarea id="copybox" class="copybox" readonly>${esc(copyBlock(active))}</textarea><button data-detail-copy>複製甲方資料</button></div><div class="section"><h3>案件狀態</h3><div class="actions" style="justify-content:flex-start">${Object.entries(statusLabels).map(([v,l])=>`<button class="status ${active.status===v?'active':''}" data-detail-status="${v}">${l}</button>`).join('')}</div></div><div class="section"><h3>內部備註</h3><textarea id="notes">${esc(active.notes||'')}</textarea><button id="save-notes">儲存備註</button></div>`;$('backdrop').classList.remove('hidden');$('drawer').classList.remove('hidden')}
function close(){active=null;$('backdrop').classList.add('hidden');$('drawer').classList.add('hidden')}async function copy(v){try{await navigator.clipboard.writeText(v);showToast('已複製')}catch{prompt('請复制',v)}}function showToast(v){clearTimeout(toastTimer);$('toast').textContent=v;$('toast').classList.remove('hidden');toastTimer=setTimeout(()=>$('toast').classList.add('hidden'),1700)}
function setQuick(days){const now=new Date(),a=new Date(now),b=new Date(now);if(days===1){a.setDate(now.getDate()-1);b.setDate(now.getDate()-1)}else if(days>1)a.setDate(now.getDate()-(days-1));$('from').value=localValue(a);$('to').value=localValue(b)}
function csvCell(v){return '"'+String(v??'').replace(/"/g,'""')+'"'}async function exportCsv(){let data=[...selected.values()];if(!data.length){data=[];let p=1;for(;;){const q=params();q.p_page=p;q.p_page_size=1000;const x=await rpc('get_f_page_leads_page',q),batch=x?.rows||[];data.push(...batch);if(!batch.length||data.length>=Number(x?.total||0))break;p++}}if(!data.length)return alert('沒有資料');const cols=['created_at','name','age','residence','phone','line_id','id_number','apply_type','apply_amount','payout_bank','warning_account','status','notes'];const csv='\ufeff'+cols.join(',')+'\r\n'+data.map(r=>cols.map(k=>csvCell(k==='status'?statusLabels[r[k]]:k==='warning_account'?warning(r[k]):r[k])).join(',')).join('\r\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download=slug+'-補助申請.csv';a.click();URL.revokeObjectURL(a.href)}
$('login-btn').onclick=login;$('password').onkeydown=e=>{if(e.key==='Enter')login()};$('logout').onclick=()=>location.reload();$('refresh').onclick=()=>load();$('clear').onclick=()=>{$('search').value=$('status').value=$('from').value=$('to').value='';load(true)};document.querySelectorAll('[data-days]').forEach(b=>b.onclick=()=>{setQuick(Number(b.dataset.days));load(true)});['from','to','status'].forEach(id=>$(id).onchange=()=>load(true));$('search').oninput=()=>{clearTimeout(searchTimer);searchTimer=setTimeout(()=>load(true),350)};$('prev').onclick=()=>{if(page>1){page--;load()}};$('next').onclick=()=>{if(page<pages){page++;load()}};$('select-all').onchange=e=>{rows.forEach(r=>e.target.checked?selected.set(r.id,r):selected.delete(r.id));render()};$('export').onclick=exportCsv;$('leads').onchange=e=>{const c=e.target.closest('[data-select]');if(c){const r=rows.find(x=>x.id===c.dataset.select);c.checked?selected.set(r.id,r):selected.delete(r.id);render()}};$('leads').onclick=e=>{const s=e.target.closest('[data-status]'),o=e.target.closest('[data-open]'),c=e.target.closest('[data-copy]');if(s)update(s.dataset.id,s.dataset.status);if(o)detail(o.dataset.open);if(c){const r=rows.find(x=>x.id===c.dataset.copy);if(r)copy(copyBlock(r))}};$('close').onclick=close;$('backdrop').onclick=close;$('detail-body').onclick=e=>{if(!active)return;const s=e.target.closest('[data-detail-status]');if(s)update(active.id,s.dataset.detailStatus);if(e.target.closest('[data-detail-copy]'))copy($('copybox').value);if(e.target.id==='save-notes')update(active.id,null,$('notes').value)};$('detail-body').oninput=e=>{if(e.target.id==='notes'&&active)$('copybox').value=copyBlock(active,e.target.value)};
</script></body></html>
