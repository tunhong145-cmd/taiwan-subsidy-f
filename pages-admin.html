<!doctype html>
<html lang="zh-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>F 專案投手管理</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef2f6;color:#17233a;font-family:"Microsoft JhengHei",sans-serif}header{min-height:66px;padding:14px 28px;background:#121d31;color:#fff;display:flex;align-items:center;justify-content:space-between;gap:14px}header h1{font-size:19px;margin:0}.nav{display:flex;gap:8px;align-items:center}.nav a,.nav button,button{border:1px solid transparent;border-radius:7px;padding:9px 13px;background:#146abd;color:#fff;text-decoration:none;font:inherit;font-size:13px;font-weight:800;cursor:pointer}.nav a,.nav button.secondary,button.secondary{background:#fff;color:#536278;border-color:#d8e0e9}main{max-width:1180px;margin:auto;padding:26px 18px}.panel{background:#fff;border:1px solid #dbe3ec;border-radius:10px;padding:20px;margin-bottom:18px;box-shadow:0 2px 8px rgba(20,40,70,.04)}.login{max-width:420px;margin:50px auto}.hidden{display:none!important}h2{margin:0 0 8px;font-size:19px}.notice{color:#718096;font-size:13px;line-height:1.6}.error{color:#b42318}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px}.fields{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.field.full{grid-column:1/-1}label{display:block;margin-bottom:6px;color:#43526a;font-size:13px;font-weight:800}input,textarea,select{width:100%;border:1px solid #d1dbe6;border-radius:7px;padding:10px;font:inherit}textarea{min-height:90px;resize:vertical}.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.pages{display:grid;gap:12px}.page{border:1px solid #dce4ed;border-radius:9px;padding:16px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px}.page h3{margin:0 0 8px}.tag{display:inline-flex;border-radius:99px;padding:3px 8px;background:#ddf5e8;color:#087747;font-size:11px}.tag.off{background:#f7e5e5;color:#ad3232}.meta{display:flex;gap:8px 16px;flex-wrap:wrap;color:#617087;font-size:13px}.link{margin-top:9px;color:#79869a;font-size:12px;overflow-wrap:anywhere}@media(max-width:700px){header{padding:13px 14px;align-items:flex-start;flex-direction:column}.nav{width:100%;overflow:auto}main{padding:12px}.fields{grid-template-columns:1fr}.field.full{grid-column:auto}.page{grid-template-columns:1fr}.toolbar{align-items:flex-start;flex-direction:column}}
</style></head><body>
<header><h1>F 專案投手管理</h1><div id="top-nav" class="nav hidden"><a href="admin.html">全部訂單</a><button class="secondary" id="logout">登出</button></div></header>
<main><section id="login" class="panel login"><h2>主管理員登入</h2><p class="notice">使用 F 專案主管理員帳號。</p><label>帳號</label><input id="username" value="admin" autocomplete="username"><div style="height:12px"></div><label>密碼</label><input id="password" type="password" autocomplete="current-password"><div style="height:14px"></div><button id="login-btn">登入</button><p id="login-msg" class="notice"></p></section>
<section id="app" class="hidden"><div class="panel toolbar"><div><h2>投手 Page</h2><div class="notice">新增後自動生成 page1、page2、page3……</div></div><button id="new-page">新增投手</button></div>
<section id="editor" class="panel hidden"><div class="toolbar"><div><h2 id="editor-title">新增投手</h2><div class="notice" id="slug-note">系统自动分配 Page 编号。</div></div><button class="secondary" id="cancel">取消</button></div><div class="fields" style="margin-top:18px"><div class="field"><label>投手备注</label><input id="operator-note" placeholder="例如：投手 1"></div><div class="field"><label>后台密码</label><input id="page-password" type="text" placeholder="新增时必填，编辑时留空表示不修改"></div><div class="field"><label>LINE 加好友链接</label><input id="line-url" placeholder="https://lin.ee/xxxxxxxx"></div><div class="field"><label>显示 LINE ID</label><input id="line-id" placeholder="@xxxxxxxx"></div><div class="field full"><label>Facebook Pixel IDs</label><textarea id="pixels" placeholder="每行或逗号分隔，可填写多个"></textarea></div><div class="field"><label>状态</label><select id="active"><option value="true">启用</option><option value="false">停用</option></select></div></div><div class="actions" style="margin-top:16px"><button id="save">儲存</button><span id="save-msg" class="notice"></span></div></section>
<section class="panel"><div id="pages" class="pages"></div><p id="empty" class="notice">尚未建立投手 Page。</p></section></section></main>
<script>
const URL_='https://xgjnmhedqwehxgwnlggo.supabase.co',KEY='sb_publishable_p_Y0qsHy4W4cv5f--pprEg_5Bdq1-kt',ADMIN='admin@taiwan-subsidy.com';
let token=sessionStorage.getItem('f_admin_token')||'',refreshToken=sessionStorage.getItem('f_admin_refresh')||'',refreshPromise=null,pages=[],editing=null;
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
function store(data){token=data?.access_token||'';refreshToken=data?.refresh_token||refreshToken||'';token?sessionStorage.setItem('f_admin_token',token):sessionStorage.removeItem('f_admin_token');refreshToken?sessionStorage.setItem('f_admin_refresh',refreshToken):sessionStorage.removeItem('f_admin_refresh')}
function clear(){token='';refreshToken='';sessionStorage.removeItem('f_admin_token');sessionStorage.removeItem('f_admin_refresh')}
async function refresh(){if(!refreshToken)return false;if(refreshPromise)return refreshPromise;refreshPromise=(async()=>{try{const r=await fetch(URL_+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:refreshToken})});if(!r.ok)throw 0;store(await r.json());return true}catch{clear();return false}finally{refreshPromise=null}})();return refreshPromise}
async function api(path,body={},retry=true){const r=await fetch(URL_+path,{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify(body)});if(r.status===401&&retry&&await refresh())return api(path,body,false);if(!r.ok)throw new Error((await r.text())||'请求失败');return r.status===204?null:r.json()}
function signedIn(on){$('login').classList.toggle('hidden',on);$('app').classList.toggle('hidden',!on);$('top-nav').classList.toggle('hidden',!on);if(on)loadPages()}
async function login(){const b=$('login-btn'),name=$('username').value.trim(),password=$('password').value;b.disabled=true;$('login-msg').textContent='登入中…';try{if(name!=='admin')throw new Error('帳號或密碼錯誤');const r=await fetch(URL_+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify({email:ADMIN,password})});if(!r.ok)throw new Error('帳號或密碼錯誤');store(await r.json());signedIn(true)}catch(e){$('login-msg').textContent=e.message;$('login-msg').className='notice error'}finally{b.disabled=false}}
async function loadPages(){try{pages=await api('/rest/v1/rpc/get_f_master_pages');render()}catch(e){if(/authorized|jwt|token/i.test(e.message)){clear();signedIn(false)}else alert('读取 Page 失败：'+e.message)}}
function landing(p){return new URL('index.html?page='+encodeURIComponent(p.slug),location.href).href}function backend(p){return new URL('page-admin.html?page='+encodeURIComponent(p.slug),location.href).href}
function render(){$('empty').classList.toggle('hidden',pages.length>0);$('pages').innerHTML=pages.map(p=>`<article class="page"><div><h3>${esc(p.slug)} <span class="tag ${p.active?'':'off'}">${p.active?'启用':'停用'}</span></h3><div class="meta"><span>投手：${esc(p.operator_note||'未备注')}</span><span>LINE：${esc(p.line_id||'未设置')}</span><span>Pixel：${esc((p.pixel_ids||[]).map(x=>typeof x==='string'?x:x.id).filter(Boolean).join(', ')||'未设置')}</span><span>密码：${p.password_set?'已设置':'未设置'}</span></div><div class="link">投放链接：${esc(landing(p))}<br>投手后台：${esc(backend(p))}</div></div><div class="actions"><button class="secondary" data-copy-land="${esc(p.slug)}">复制投放链接</button><button class="secondary" data-copy-admin="${esc(p.slug)}">复制后台链接</button><button data-edit="${esc(p.slug)}">编辑</button></div></article>`).join('')}
function openEditor(p=null){editing=p;$('editor-title').textContent=p?'编辑 '+p.slug:'新增投手';$('slug-note').textContent=p?'Page 编号不可修改。':'系统将自动生成下一个 Page 编号。';$('operator-note').value=p?.operator_note||'';$('page-password').value='';$('line-url').value=p?.line_url||'';$('line-id').value=p?.line_id||'';$('pixels').value=(p?.pixel_ids||[]).map(x=>typeof x==='string'?x:x.id).filter(Boolean).join('\n');$('active').value=String(p?.active??true);$('active').disabled=p?.slug==='main';$('save-msg').textContent='';$('editor').classList.remove('hidden');$('editor').scrollIntoView({behavior:'smooth',block:'start'})}
async function save(){const b=$('save'),password=$('page-password').value.trim(),ids=$('pixels').value.split(/[\s,]+/).map(x=>x.trim()).filter(Boolean),common={p_operator_note:$('operator-note').value.trim(),p_line_url:$('line-url').value.trim(),p_line_id:$('line-id').value.trim(),p_pixel_ids:ids.map(id=>({id,platform:'facebook',enabled:true}))};if(!editing&&password.length<6){$('save-msg').textContent='新增投手时密码至少 6 位';return}if(password&&password.length<6){$('save-msg').textContent='新密码至少 6 位';return}b.disabled=true;$('save-msg').textContent='保存中…';try{if(editing)await api('/rest/v1/rpc/update_f_page',{target_slug:editing.slug,...common,p_active:$('active').value==='true',p_password:password||null});else await api('/rest/v1/rpc/create_f_page',{...common,p_password:password});$('editor').classList.add('hidden');await loadPages()}catch(e){$('save-msg').textContent='保存失败：'+e.message}finally{b.disabled=false}}
async function copyText(text){try{await navigator.clipboard.writeText(text);alert('已复制')}catch{prompt('请复制链接',text)}}
$('login-btn').onclick=login;$('password').onkeydown=e=>{if(e.key==='Enter')login()};$('logout').onclick=async()=>{clear();location.reload()};$('new-page').onclick=()=>openEditor();$('cancel').onclick=()=>$('editor').classList.add('hidden');$('save').onclick=save;$('pages').onclick=e=>{const edit=e.target.closest('[data-edit]'),land=e.target.closest('[data-copy-land]'),admin=e.target.closest('[data-copy-admin]');if(edit)openEditor(pages.find(p=>p.slug===edit.dataset.edit));if(land)copyText(landing(pages.find(p=>p.slug===land.dataset.copyLand)));if(admin)copyText(backend(pages.find(p=>p.slug===admin.dataset.copyAdmin)))};
(async()=>{if(token){signedIn(true);return}if(await refresh()){signedIn(true);return}signedIn(false)})();
</script></body></html>
